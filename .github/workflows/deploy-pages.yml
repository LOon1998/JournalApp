name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/lumina-settings-page-yvuw7c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Targeting the same "github-pages" environment as the deploy job
    # below means this job can also read secrets scoped to that
    # environment (not just repository-level ones) — in case
    # GEMINI_API_KEY ends up added there instead of as a plain repo
    # secret, it's still visible here either way.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
