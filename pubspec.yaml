name: lumina
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+54

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Quicksand typeface, matching the web mockups' font-family.
  google_fonts: ^6.2.1
  # Local persistence for entries/settings.
  shared_preferences: ^2.3.3
  # Pinned to match flutter_localizations' own requirement (was ^0.19.0).
  intl: ^0.20.2
  # Hands text off to the OS share sheet (Messages, Mail, other apps) —
  # sharing an entry from its detail page.
  share_plus: ^10.1.4
  # Builds the real, selectable-text PDF for Entry Detail's "Export as
  # PDF" — a proper document (paginates automatically for a long entry),
  # not a screenshot-of-the-screen the way the image Share option is.
  pdf: ^3.11.1
  # Just for PdfGoogleFonts — pdf's own built-in fonts are Latin-only
  # (Base14/Helvetica), which silently render Chinese text as blank boxes.
  # This fetches a real CJK-capable font (Noto Sans SC) the first time a
  # PDF is exported and caches it, rather than bundling a multi-MB font
  # file into the app itself.
  printing: ^5.13.4
  # Camera/gallery photo capture for journal entries. Its own
  # imageQuality/maxWidth/maxHeight params handle compression before the
  # bytes ever reach us, so no separate image-processing package needed.
  image_picker: ^1.1.2
  # Microphone recording for voice notes.
  record: ^5.1.2
  # Playback for recorded voice notes.
  audioplayers: ^6.1.0
  # Temp-file staging while recording/reading picked media, before it's
  # base64-encoded into the entry and the temp file is discarded.
  path_provider: ^2.1.5
  # fetch()/URL bindings — used on web only, to read a recorded voice
  # note's bytes back out of the blob: URL record's web backend returns.
  web: ^1.1.0
  # REST calls to the Gemini API for Insights' Weekly Trend AI refine.
  http: ^1.2.2
  # Insights' Weekly Trend chart — swapped in for the hand-rolled
  # CustomPainter version, which had visible smoothing artifacts.
  fl_chart: ^0.69.2
  # Accounts + per-user cloud storage, so each person's journal is their
  # own private data instead of everything living in one browser's local
  # storage. See firebase_options.dart for the one-time project setup
  # this still needs before it actually connects to anything.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  # Settings' "Notifications" toggle — a real daily reminder to journal,
  # scheduled on-device (Android/iOS only; see notification_service.dart
  # for why web is a no-op).
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # Deep-links Settings' notification row straight to the OS's own
  # per-app notification settings page when it's blocked there — the
  # plugin above has no equivalent of its own, and this is a one-job
  # package, not a general permissions library, to reach for.
  app_settings: ^5.1.1
  # Just for Permission.notification.status — flutter_local_notifications'
  # own areNotificationsEnabled() only ever returns a plain bool, with no
  # way to tell "never asked yet" apart from "explicitly denied", which
  # is exactly the ambiguity that caused a real bug (Settings' toggle
  # disabling itself, permanently, for anyone who hadn't been asked yet —
  # meaning it could never trigger the OS's own permission prompt in the
  # first place). permission_handler's real tri-state PermissionStatus
  # is what actually distinguishes those.
  permission_handler: ^11.3.1
  # Privacy & Security's Pattern Lock — hashing the drawn pattern before
  # storing it locally (see app_lock_service.dart for why it doesn't sync
  # to Firestore like the rest of AppState does).
  crypto: ^3.0.6
  lottie: ^3.5.1
  url_launcher: ^6.3.2
  # First-run guided tour (bottom nav, Aura, check-in card, Journal's
  # photo/voice/tag buttons, Settings) — see lib/services/app_tour.dart.
  showcaseview: ^5.1.0
  # Settings' Language picker — English + Chinese for now, see
  # lib/l10n/app_en.arb / app_zh.arb for the actual translated strings.
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Generates the mipmap-*/ic_launcher.png files (and Play Store icon) from
  # assets/branding/1024.png — run via `dart run flutter_launcher_icons`,
  # not needed at app runtime, hence dev-only.
  flutter_launcher_icons: ^0.14.3

# path_provider resolves to path_provider_android 2.3.1 by default, which
# switched from a plain Kotlin implementation to a Dart-FFI-based one built
# on package:jni — that package compiles a small native library via CMake,
# which drags the Android NDK (a many-GB download) into every build even
# though nothing else in this app needs native/NDK compilation. Pinned back
# to the last plain-Kotlin release to avoid that entirely.
dependency_overrides:
  path_provider_android: 2.2.23
  # record's own pubspec caps record_linux at "<1.0.0", which resolves to
  # 0.7.2 — but that version was written against an older
  # record_platform_interface (^1.0.2) and doesn't implement methods the
  # currently-resolved record_platform_interface 1.6.0 requires
  # (startStream, hasPermission's `request` param), so the app fails to
  # compile even for an Android-only build (Dart's kernel compiler builds
  # every platform implementation of a plugin together, regardless of
  # target). This app never ships a Linux build, so overriding past
  # record's own upper bound to a version that actually matches 1.6.0 is
  # safe here.
  record_linux: 1.3.1

# Config for the flutter_launcher_icons dev tool above. 1024.png already has
# its own flattened cream background baked in (not a transparent cutout), so
# this generates the plain/legacy icon directly from it rather than trying
# to split it into an adaptive-icon foreground+background pair.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/1024.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml) —
  # Settings' Language picker.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The real Moodlet logo artwork — see the loading screen, top bar, and
  # About/auth screens for where each of these two gets used.
  assets:
    - assets/branding/logoIcon.png
    - assets/branding/logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
